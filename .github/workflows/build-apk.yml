name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION_STR"
          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "Error: Active Java version cannot be detected." >&2
            exit 1
          fi
          MAJOR_VERSION=$(echo "$JAVA_VERSION_STR" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ]; then
            echo "Error: Java major version could not be parsed." >&2
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (found Java $MAJOR_VERSION)." >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $MAJOR_VERSION ($JAVA_VERSION_STR)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist and could not be created." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Exact APK file not found at $APK_PATH" >&2
            echo "Listing APK files discovered in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk not found."
            fi
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file $APK_PATH is empty." >&2
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: Target file $APK_PATH does not end in .apk." >&2
            exit 1
          fi
          echo "APK successfully verified at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TMP_DIR/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ]; then
            echo "Error: Failed to copy APK to temporary release directory." >&2
            exit 1
          fi
          echo "Prepared APK release asset at $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "Error: Prepared APK asset does not exist at $ASSET_FILE" >&2
            exit 1
          fi
          if [ ! -s "$ASSET_FILE" ]; then
            echo "Error: Prepared APK asset is empty at $ASSET_FILE" >&2
            exit 1
          fi
          if [[ "$ASSET_FILE" != *.apk ]]; then
            echo "Error: Prepared APK asset does not end in .apk: $ASSET_FILE" >&2
            exit 1
          fi
          BASE_NAME=$(basename "$ASSET_FILE")
          if [ "$BASE_NAME" != "app-debug.apk" ]; then
            echo "Error: Asset file must be named exactly app-debug.apk, but is $BASE_NAME" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES="This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions run number: ${{ github.run_number }}
          - GitHub Actions run attempt: ${{ github.run_attempt }}
          - Commit SHA: ${{ github.sha }}

          Permanent direct download link for the latest debug APK:
          https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}"
